<!doctype html>
<html
  lang="{{ site.Language.Locale | default `en` }}"
  class="scroll-smooth"
  data-default-appearance="{{ site.Params.defaultAppearance | default `light` }}"
  data-auto-appearance="{{ site.Params.autoSwitchAppearance | default true }}">
  {{- partial "head.html" . -}}
  <body class="flex flex-col h-screen m-auto leading-7 max-w-7xl px-6 sm:px-14 md:px-24 lg:px-32 text-lg bg-neutral text-neutral-900 dark:bg-neutral-800 dark:text-neutral bf-scrollbar">
    <div id="the-top" class="absolute flex self-center">
      <a
        class="px-3 py-1 text-sm -translate-y-8 rounded-b-lg bg-primary-200 focus:translate-y-0 dark:bg-neutral-600"
        href="#main-content">
        <span class="font-bold text-primary-600 pe-2 dark:text-primary-400">&darr;</span>
        Skip to main content
      </a>
    </div>
    <header>
      {{ partial "header.html" . }}
    </header>
    <div class="relative flex flex-col grow">
      <main id="main-content" class="grow">
        {{ block "main" . }}{{ end }}
      </main>
      {{- partial "footer.html" . -}}
    </div>
    <script defer src="{{ "js/appearance.js" | relURL }}?{{ site.Params.theme_seconds }}"></script>
    {{- range site.Params.plugins_js }}
    <script src="{{ . }}"></script>
    {{- end }}
  </body>
</html>
